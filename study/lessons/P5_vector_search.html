@font-face{font-family:"Literata";src:url("fonts/literata-latin-opsz-normal.woff2") format("woff2");font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:"Literata";src:url("fonts/literata-latin-opsz-italic.woff2") format("woff2");font-weight:200 900;font-style:italic;font-display:swap}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--body-size)/1.62 var(--f-body)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);font-weight:var(--h-weight);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,4.2vw,2.6rem);letter-spacing:-.01em}
h2{font-size:clamp(1.3rem,2.8vw,1.65rem)}
h3{font-size:1.06rem}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--code);padding:.08em .35em;border-radius:4px}
pre{font-family:var(--f-mono);font-size:.84rem;background:var(--code);padding:12px 14px;border-radius:var(--radius);overflow-x:auto;margin:0;line-height:1.5;border:1px solid var(--line)}
ul,ol{margin:0;padding-left:1.25em}
li+li{margin-top:4px}

/* ---------- top bar, sidebar, layout ---------- */
.top{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .t{font-family:var(--f-head);font-weight:var(--h-weight);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.menu,.home{display:inline-flex;gap:4px;align-items:center;flex:none}
.home{text-decoration:none}
.side .course a{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.88rem;line-height:1.35}
.side .course a .n{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.side .course a:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.top .btn,.top .seg{flex:none;white-space:nowrap}
.crumb{display:none;color:var(--muted);font-weight:400;font-family:var(--f-body)}
html[data-toc="hidden"] .crumb{display:inline}
.topprog{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--accent);transition:width .15s}
html:not([data-toc="hidden"]) .topprog{display:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex:none}
.seg button{font:inherit;font-family:var(--f-body);font-size:.88rem;border:0;background:transparent;color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn,select.btn{font:inherit;font-family:var(--f-body);font-size:.88rem;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
/* Panel docked to the window edge (like VS Code); the text starts right beside it; spare space goes to the far side only. */
.shell{--side-w:260px;display:grid;grid-template-columns:var(--side-w) minmax(0,var(--content-w));justify-content:start;column-gap:48px;padding:0 24px 0 0}
aside.side{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:20px 12px 24px;font-family:var(--f-body)}
.side .lab{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px}
.side .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 8px 8px}
.side .head .lab{margin:0}
.side .head button{font:inherit;font-family:var(--f-body);font-size:.74rem;border:1px solid var(--rule);background:var(--paper);color:var(--muted);border-radius:6px;padding:2px 7px;cursor:pointer}
.side .head button:hover{color:var(--ink);border-color:var(--ink)}
html[data-side="right"] .shell{grid-template-columns:minmax(0,var(--content-w)) var(--side-w);justify-content:end;padding:0 0 0 24px}
html[data-side="right"] aside.side{order:2;border-right:0;border-left:1px solid var(--line)}
html[data-toc="hidden"] .shell{grid-template-columns:minmax(0,var(--content-w));justify-content:center;padding:0 24px}
html[data-toc="hidden"] aside.side{display:none}
.prog{margin:0 8px 6px;display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.prog .track{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .track i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.side nav a{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.88rem;line-height:1.35}
.side nav a .n{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.side nav a:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.side nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side nav a.on .n{color:var(--accent)}
.side nav a .fo{font-size:.66rem;font-family:var(--f-mono);color:var(--dense);border:1px solid var(--dense);border-radius:4px;padding:0 4px}
html[data-depth="short"] .side nav a.fullonly{opacity:.55}
main{padding:8px 0 90px;min-width:0;width:100%}
@media (max-width:980px){
  .shell,html[data-side="right"] .shell,html[data-toc="hidden"] .shell{grid-template-columns:minmax(0,1fr);padding:0}
  aside.side,html[data-toc="hidden"] aside.side,html[data-side="right"] aside.side{display:block;position:fixed;left:0;top:56px;bottom:0;height:auto;width:min(300px,86vw);z-index:25;transform:translateX(-104%);transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.25);background:var(--side);padding:16px 12px 24px}
  html[data-side="right"] aside.side{left:auto;right:0;transform:translateX(104%)}
  body.side-open aside.side{transform:none!important}
  .topprog{display:block!important}
  .crumb{display:inline}
  main{padding:8px 16px 90px}
}
@media (max-width:620px){.top .t{display:none}.top .seg{margin-left:auto}.top select.btn{max-width:118px}}
@media (max-width:480px){.top{gap:6px;padding:0 10px}.top .lbl{display:none}.top select.btn{max-width:100px}.seg button{padding:5px 10px}}
.totop{position:fixed;right:20px;bottom:20px;width:46px;height:46px;border-radius:50%;border:1px solid var(--rule);background:var(--ink);color:var(--paper);font-size:1.3rem;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:20}
.totop.show{opacity:1;pointer-events:auto;transform:none}

/* ---------- content blocks ---------- */
header.hero{padding:28px 0 4px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:1.05rem}
section.s{padding-top:var(--sec-pad);display:grid;gap:14px}
section.s>.num{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;color:var(--accent)}
.lede{font-size:1.1rem}
.badge{font-size:.72rem;font-family:var(--f-mono);padding:1px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);background:var(--card);white-space:nowrap;vertical-align:1px}
.badge.m{border-color:var(--good);color:var(--good)}
.badge.t{border-color:var(--warn);color:var(--warn)}
.badge.f{border-color:var(--dense);color:var(--dense)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.call{padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;border-left:4px solid}
.call.proj{border-color:var(--good);background:var(--good-soft)}
.call.wrong{border-color:var(--bad);background:var(--bad-soft)}
.call.wrong>b:first-child{color:var(--bad)}
.call.note{border-color:var(--warn);background:var(--warn-soft)}
.full{border:1px dashed var(--dense);border-radius:var(--radius);padding:14px 16px;display:grid;gap:12px;background:color-mix(in srgb,var(--dense-soft) 50%,transparent)}
.full>.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dense)}
html[data-depth="short"] .full{display:none}
.two{display:grid;gap:12px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.three{display:grid;gap:10px}
@media (min-width:760px){.three{grid-template-columns:repeat(3,1fr)}}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-family:var(--f-body)}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.84rem}
.tw{overflow-x:auto}
caption,figcaption{caption-side:bottom;text-align:left;color:var(--muted);font-size:.84rem;padding-top:6px;font-family:var(--f-body)}
figure{margin:0;display:grid;gap:8px}
.hit{color:var(--good);font-weight:700}
.miss{color:var(--bad);font-weight:700}
.formula{font-family:var(--f-mono);font-size:.92rem;background:var(--code);padding:12px 14px;border-radius:var(--radius);overflow-x:auto;line-height:1.75;border:1px solid var(--line)}
.formula .w{color:var(--accent);font-weight:700}
.formula .c{color:var(--muted)}

/* at a glance */
.glance{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:grid;gap:5px;align-content:start}
.g h3{font-size:.95rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.g h3 a{font-family:var(--f-mono);font-size:.72rem;font-weight:400;text-decoration:none}
.g .fx{font-family:var(--f-mono);font-size:.8rem;background:var(--code);border:1px solid var(--line);padding:5px 8px;border-radius:6px;white-space:normal;overflow-wrap:anywhere;line-height:1.45}
.g p{font-size:.88rem}
.g .ex{font-size:.8rem;color:var(--muted)}
.key{font-size:.86rem;color:var(--muted)}
.key code{color:var(--ink)}

/* rank cards, index explorer */
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rank{border-radius:var(--radius);padding:14px;border:1px solid var(--line);background:var(--card);display:grid;gap:4px}
.rank .big{font-family:var(--f-head);font-size:2.5rem;line-height:1;font-weight:700}
.rank.d .big{color:var(--dense)}
.rank.k .big{color:var(--accent)}
.idx-docs{display:grid;gap:6px}
.doc{font-family:var(--f-mono);font-size:.8rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);display:flex;gap:10px;align-items:baseline}
.doc .id{font-weight:700;min-width:2.2em}
.doc .tok{padding:0 2px;border-radius:3px}
.doc .tok.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.doc.cand{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-family:var(--f-mono);font-size:.82rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.cards{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.icard{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:8px 10px 10px;position:relative}
.icard::before{content:"";position:absolute;left:0;right:0;top:28px;border-top:1px solid var(--accent);opacity:.55}
.icard h4{margin:0 0 10px;font-family:var(--f-mono);font-size:.92rem}
.icard p{font-size:.82rem;font-family:var(--f-mono)}
.icard .meta{color:var(--muted);font-family:var(--f-body);font-size:.78rem;margin-top:4px}

/* controls and charts */
.ctl{display:grid;grid-template-columns:160px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.9rem;font-family:var(--f-body)}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl output{font-family:var(--f-mono);text-align:right}
@media (max-width:560px){.ctl{grid-template-columns:110px minmax(0,1fr) 54px}}
svg.chart{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
svg .ax{stroke:var(--rule);stroke-width:1}
svg .grid{stroke:var(--line);stroke-width:1}
svg text{fill:var(--muted);font-family:"Segoe UI",system-ui,sans-serif;font-size:12px}
svg .lab{fill:var(--ink);font-size:12.5px}
svg .s-bm25{stroke:var(--accent);stroke-width:3;fill:none}
svg .s-tfidf{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:6 5}
svg .s-raw{stroke:var(--accent);stroke-width:1.5;fill:none;stroke-dasharray:2 4;opacity:.8}
svg .s-ceil{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
svg .s-ref{stroke:var(--dense);stroke-width:2;fill:none;opacity:.55}
svg .dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
svg .dot2{fill:var(--dense);stroke:var(--card);stroke-width:2}
svg .zero{stroke:var(--ink);stroke-width:1;opacity:.45}
.readout{font-size:.9rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--f-body)}
.readout b{font-family:var(--f-mono)}
.sbars{display:grid;gap:8px}
.sbar{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.88rem;font-family:var(--f-body)}
.sbar .track{display:flex;height:22px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.sbar .p1{background:var(--accent)}
.sbar .p2{background:var(--warn);opacity:.75}
.sbar .v{font-family:var(--f-mono);text-align:right}
@media (max-width:560px){.sbar{grid-template-columns:92px minmax(0,1fr) 54px}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted);font-family:var(--f-body)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.play{display:grid;gap:10px}
.play label{display:grid;gap:4px;font-size:.88rem;font-family:var(--f-body)}
.play input[type=text]{font:inherit;font-family:var(--f-mono);font-size:.86rem;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.toks{display:grid;gap:8px}
.tokrow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);display:grid;gap:6px}
.tokrow .h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;font-family:var(--f-body)}
.tokrow .h b{font-family:var(--f-mono);font-size:.84rem}
.tk{display:inline-block;font-family:var(--f-mono);font-size:.78rem;padding:1px 6px;margin:2px 3px 2px 0;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.tk.sh{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.verdict{font-size:.86rem;font-weight:600}
.verdict.yes{color:var(--good)}
.verdict.no{color:var(--bad)}
.ov{position:relative;height:84px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.ov .w{position:absolute;height:24px;border-radius:4px;font-size:.76rem;font-family:var(--f-mono);display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--dense-soft);border:1px solid var(--dense)}
.ov .w82{top:12px;left:4%;width:56%}
.ov .w83{top:46px;left:40%;width:56%}
.ov .pin{position:absolute;top:4px;bottom:4px;left:44.1%;width:3px;background:var(--accent)}
.ov .pinl{position:absolute;top:2px;left:45.3%;font-size:.74rem;font-family:var(--f-mono);color:var(--accent);font-weight:700}
.q{display:grid;gap:8px}
.q fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;background:var(--card);margin:0;display:grid;gap:6px}
.q legend{font-weight:600;padding:0 4px}
.q label{display:flex;gap:8px;align-items:flex-start;font-size:.94rem;cursor:pointer}
.q .fb{font-size:.9rem;padding:6px 10px;border-radius:6px;display:none}
.q .fb.show{display:block}
.q .fb.ok{background:var(--good-soft);color:var(--good)}
.q .fb.no{background:var(--bad-soft);color:var(--bad)}
.check{display:grid;gap:6px}
.check label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:.92rem}
.check label:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.check input{width:17px;height:17px;margin-top:3px;accent-color:var(--good)}
.check .how{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
footer{margin-top:48px;padding:22px 0 0;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem;display:grid;gap:8px}


/* the theory in one read: a numbered chain of ideas */
.chain{list-style:none;counter-reset:idea;margin:0;padding:0;display:grid;gap:0}
.chain>li{counter-increment:idea;position:relative;padding:0 0 22px 52px;display:grid;gap:7px;margin:0}
.chain>li::before{content:counter(idea);position:absolute;left:0;top:-2px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);font:600 .9rem/1 var(--f-body);font-variant-numeric:lining-nums}
.chain>li::after{content:"";position:absolute;left:16.5px;top:36px;bottom:4px;width:1px;background:var(--rule)}
.chain>li:last-child::after{display:none}
.chain h3{font-size:1.08rem}
.chain .formula{font-size:.86rem;padding:8px 12px;line-height:1.65}
.chain .go{justify-self:start;font-size:.86rem;font-family:var(--f-body);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:1px 10px;color:var(--accent)}
.chain .go:hover{border-color:var(--accent)}

/* ---------- small per-theme touches ---------- */
[data-style="textbook"] section.s>.num{font-family:var(--f-head);font-size:.95rem;letter-spacing:.02em;font-style:italic;text-transform:none}
[data-style="textbook"] #answer .lede::first-letter{float:left;font-size:3.1em;line-height:.9;padding:5px 8px 0 0;color:var(--accent);font-family:var(--f-head)}
[data-style="textbook"] .call{border-left-width:2px;font-style:italic}
[data-style="textbook"] .call b{font-style:normal}
[data-style="editor"] h2::before{content:"## ";color:var(--muted)}
[data-style="editor"] h1::before{content:"# ";color:var(--muted)}
[data-style="editor"] .formula,[data-style="editor"] pre{border-left:3px solid var(--accent)}
[data-style="minimal"] .card,[data-style="minimal"] .g,[data-style="minimal"] .rank,[data-style="minimal"] svg.chart{border-color:transparent}
[data-style="minimal"] aside.side{border-right-color:transparent}
[data-style="minimal"] .call{border-left-width:3px}
[data-style="catalogue"] .g,[data-style="catalogue"] .card{box-shadow:0 1px 0 var(--line)}
/* Reader themes: the rich typographic details */
:is([data-style="reader"],[data-style="hyper"]){--content-w:720px}
:is([data-style="reader"],[data-style="hyper"]) body{line-height:1.72;font-variant-numeric:lining-nums;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
:is([data-style="reader"],[data-style="hyper"]) :is(p,li){text-wrap:pretty;hanging-punctuation:first}
:is([data-style="reader"],[data-style="hyper"]) section.s{border-top:1px solid var(--line);margin-top:30px}
:is([data-style="reader"],[data-style="hyper"]) section.s>.num{font-family:var(--f-body);font-variant-caps:all-small-caps;font-size:1rem;letter-spacing:.09em;color:var(--accent)}
:is([data-style="reader"],[data-style="hyper"]) .eyebrow{font-family:var(--f-body);font-variant-caps:all-small-caps;font-size:.95rem;text-transform:none;letter-spacing:.08em}
:is([data-style="reader"],[data-style="hyper"]) h2{font-size:clamp(1.5rem,3vw,1.9rem);letter-spacing:-.005em}
[data-style="reader"] h1{font-weight:720;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.015em}
:is([data-style="reader"],[data-style="hyper"]) #answer .lede{font-size:1.2em;line-height:1.62}
[data-style="reader"] #answer .lede::first-letter{float:left;font-size:3.5em;line-height:.84;padding:6px 10px 0 0;color:var(--accent);font-weight:700}
:is([data-style="reader"],[data-style="hyper"]) .call{border-left-width:3px;border-radius:0 8px 8px 0;padding:12px 16px}
:is([data-style="reader"],[data-style="hyper"]) .call.proj::before{content:"✦ ";color:var(--good)}
:is([data-style="reader"],[data-style="hyper"]) a{text-underline-offset:.18em;text-decoration-thickness:1px}
:is([data-style="reader"],[data-style="hyper"]) ::selection{background:var(--accent-soft)}
:is([data-style="reader"],[data-style="hyper"]) table{font-variant-numeric:lining-nums tabular-nums}
:is([data-style="reader"],[data-style="hyper"]) :is(.g,.card,.rank){box-shadow:0 1px 2px rgba(0,0,0,.05)}
:is([data-style="reader"],[data-style="hyper"]) .side nav a{font-size:.9rem}
@media print{.top,aside.side,.totop,.ctl,.btn,.play input{display:none!important} html[data-depth] .full{display:grid!important} .shell{display:block} main{padding:0}}

/* ---------- lesson additions (shared with P1) ---------- */
.tk.mk{color:var(--muted);border-style:dashed}
svg .fbox{fill:var(--paper);stroke:var(--rule);stroke-width:1.2}
svg .fbox.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
svg .farr{stroke:var(--muted);stroke-width:1.6}
svg .fhead{fill:var(--muted)}
svg .rb1{fill:var(--muted);opacity:.55}
svg .rb2{fill:var(--accent)}
svg .tbar{fill:var(--accent)}
.sbar .pm{background:var(--muted);opacity:.55}
.sbar .p3{background:var(--dense)}
.sbar .ph,.legend i.hatch{background:repeating-linear-gradient(45deg,var(--warn) 0 3px,transparent 3px 7px);opacity:.8}
.sbar .p4{background:var(--dense);opacity:.8}
.sbar .p5{background:var(--good)}
.sbar .pe{background:transparent}
pre .c{color:var(--muted)}
table.heat td.hc{text-align:center;font-weight:600}
table.heat td.g2{background:var(--good-soft);color:var(--good)}
table.heat td.g1{background:var(--warn-soft);color:var(--warn)}
table.heat td.g0{background:var(--bad-soft);color:var(--bad)}
/* grid children may shrink below their content, so wide code scrolls inside its box on phones */
section.s>*,.two>*,.three>*,.full>*,.card>*,figure>*{min-width:0}
main :not(pre)>code{overflow-wrap:anywhere}
@media (max-width:620px){.badge{white-space:normal}}
/* ---------- P4 additions ---------- */
svg .s-q{stroke:var(--ink);stroke-width:3;fill:none}
svg .s-a{stroke:var(--accent);stroke-width:3;fill:none}
svg .s-b{stroke:var(--dense);stroke-width:3;fill:none}
svg .s-chord{stroke:var(--bad);stroke-width:3;fill:none}
svg .s-unit{stroke:var(--rule);stroke-width:1.2;fill:none;stroke-dasharray:4 4}
svg .hq{fill:var(--ink)}
svg .ha{fill:var(--accent)}
svg .hb{fill:var(--dense)}
svg .grip{fill:var(--dense);fill-opacity:.18;stroke:var(--dense);stroke-width:1.5;cursor:grab}
svg .bad{fill:var(--bad);stroke:var(--card);stroke-width:2}
svg .good{fill:var(--good);stroke:var(--card);stroke-width:2}
svg .band{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
svg .cut{fill:var(--muted);opacity:.25}
svg .read{fill:var(--accent);opacity:.75}
svg .mark{stroke:var(--bad);stroke-width:2.5}
svg .lim{stroke:var(--warn);stroke-width:2;stroke-dasharray:5 4}
svg .small{font-size:11px}
svg text.ink{fill:var(--ink)}
svg text.badt{fill:var(--bad);font-weight:700}
svg text.goodt{fill:var(--good)}
.arrowplay{display:grid;gap:10px}
.arrowplay svg{touch-action:none}
.mtab td.win{color:var(--good);font-weight:700}
.neg{color:var(--bad);font-weight:700}
table.mat td.hc{text-align:center;font-family:var(--f-mono);font-size:.84rem}
table.mat td.diag{outline:2px solid var(--good);outline-offset:-2px}
table.mat td.rmax{font-weight:800}
table.mat td.h3{background:color-mix(in srgb,var(--accent) 42%,transparent)}
table.mat td.h2{background:color-mix(in srgb,var(--accent) 30%,transparent)}
table.mat td.h1{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.seg.inl{justify-self:start}
.calc{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.calc label{display:grid;gap:4px;font-size:.86rem;font-family:var(--f-body)}
.calc input,.calc select{font:inherit;font-family:var(--f-mono);font-size:.86rem;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.passes{display:grid;gap:10px}
@media (min-width:760px){.passes{grid-template-columns:repeat(3,1fr)}}
.pass{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:10px 12px;display:grid;gap:4px}
.pass .big{font-family:var(--f-head);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.pass.bi .big{color:var(--accent)}
.pass.ce .big{color:var(--dense)}
.pass.all .big{color:var(--bad)}
.empty{color:var(--muted);font-style:italic}
